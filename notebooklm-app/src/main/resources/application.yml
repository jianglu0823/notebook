server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: notebooklm-app
  # 从 Nacos 配置中心导入(可选,导入失败不阻断启动,便于本地开发)
  config:
    import:
      - optional:nacos:notebooklm-app.yaml
  cloud:
    # 强制 Nacos 客户端只挑 llm-note_default 网段(172.21.0.x)的 IP 注册
    # 防止 nblm-app 容器误加入其他 Docker 网络后,把不可达的 IP 报给 Nacos
    # 导致 nblm-gateway 拉路由后 30s ConnectTimeoutException → 500 Internal Server Error
    inetutils:
      preferred-networks: 172.21.0
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}

  # MySQL(对外映射 3307)
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/notebooklm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none   # 表已由 init.sql 建好
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123456}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 3 个调度任务(autonomous / resident-interaction / xhs-cron),给 3 线程。
  task:
    scheduling:
      pool:
        size: 3

# 应用自定义配置
notebooklm:
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    chat-model: qwen-plus
    vl-model: qwen-vl-max
    embedding-model: text-embedding-v3
    tts-model: cosyvoice-v1
    tts-voice-a: longwan     # 主持人 A 音色
    tts-voice-b: longcheng   # 主持人 B 音色
    # OpenAI 兼容模式 baseUrl(DashScope 官方提供),chat + function calling 全走这里(AgentScope 原生 DashScope SDK
    # 解析 qwen function calling 不可靠,丢 tool call input 字段)
    openai-compatible-base-url: ${DASHSCOPE_OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    # 可选文本模型及商用单价(元 / 1000 token),供会议/写作选用与 token→元 换算;以百炼控制台实际为准
    pricing:
      - { name: qwen-flash, label: "Qwen Flash · 极速便宜", input-per1k: 0.00015, output-per1k: 0.0006 }
      - { name: qwen-turbo, label: "Qwen Turbo · 便宜快", input-per1k: 0.0003, output-per1k: 0.0006 }
      - { name: qwen-plus,  label: "Qwen Plus · 均衡",   input-per1k: 0.0008, output-per1k: 0.002 }
      - { name: qwen-max,   label: "Qwen Max · 最强",    input-per1k: 0.0024, output-per1k: 0.0096 }
      - { name: qwen-long,  label: "Qwen Long · 长文本", input-per1k: 0.0005, output-per1k: 0.002 }
  zhipu:
    api-key: ${ZHIPU_API_KEY:}
    base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    text-model: glm-4.7-flash
    vl-model: glm-4.6v-flash
    image-model: cogview-3-flash
    video-model: cogvideox-flash
    reasoning-model: glm-z1-flash    # 推理模型:一生回顾悼词 / 沙盒世界报告
    # 主模型(glm-4.7-flash)调用失败时按序降级的备用免费模型
    fallback-models:
      - glm-4-flash-250414
      - glm-4.5-flash
    # 智谱免费模型,单价 0;仅用于前端可选项展示与 normalize 放行
    pricing:
      - { name: glm-4.7-flash,           label: "智谱免费模型 · GLM-4.7 Flash", input-per1k: 0, output-per1k: 0 }
      - { name: glm-4.5-flash,           label: "GLM-4.5 Flash · 免费备用",   input-per1k: 0, output-per1k: 0 }
      - { name: glm-4-flash-250414,      label: "GLM-4 Flash · 免费备用",     input-per1k: 0, output-per1k: 0 }
      - { name: glm-z1-flash,            label: "GLM-Z1 Flash · 推理免费",    input-per1k: 0, output-per1k: 0 }
      - { name: glm-4.6v-flash,          label: "GLM-4.6V · 多模态免费",   input-per1k: 0, output-per1k: 0 }
      - { name: glm-4.1v-thinking-flash, label: "GLM-4.1V Thinking · 免费", input-per1k: 0, output-per1k: 0 }
  milvus:
    host: ${MILVUS_HOST:127.0.0.1}
    port: ${MILVUS_PORT:19530}
    collection: nblm_chunks
    dim: 1024   # text-embedding-v3 维度
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    audio-dir: ${AUDIO_DIR:./audio}
    image-dir: ${IMAGE_DIR:./images}
  world:
    workspace-root: ${WORLD_WORKSPACE_ROOT:./data/agents}   # HarnessAgent 每位居民的独立工作区(长期记忆落盘)
    text-model: ${WORLD_TEXT_MODEL:glm-4.7-flash}           # 小镇统一默认文本模型(智谱免费)
    autonomous-model: ${WORLD_AUTONOMOUS_MODEL:glm-4.7-flash}   # 自主行动/1:1对话默认模型(智谱免费)
    # town-children-rules:孩子出生规则外部化。缺省值见 WorldChildrenProperties。
    children:
      # avatar-pool: ["👶","👧","👦","🧒","🧒🏻","🧒🏼","🧒🏽","🧒🏾","🧒🏿"]
      # max-per-couple: 3
  auth:
    jwt-secret: ${JWT_SECRET:change-me-in-prod-at-least-32-bytes-long-secret}
    jwt-expiry-seconds: ${JWT_EXPIRY_SECONDS:604800}   # 7 天
  # schedule-agent 独立微服务(端口 8081),notebooklm-app 通过 /api/schedule/** 反代
  schedule-agent:
    base-url: ${SCHEDULE_AGENT_BASE_URL:http://host.docker.internal:8081}
    internal-token: ${SCHEDULE_AGENT_INTERNAL_TOKEN:dev-internal-token-change-me}
    guest-cookie-name: ${GUEST_COOKIE_NAME:nblm_guest}
  companion:
    default-model: glm-4.7-flash          # 伴侣创建/缺省文本模型(已 normalize)
    memory-search-k: 5                    # 长期记忆 Milvus 检索 top-K
    asr-model: paraformer-realtime-v2     # 语音消息转写(DashScope)
    intimacy-daily-cap: 50                # 亲密度日增量上限
    reminder-hours: 2                     # 连续使用提醒阈值
    context-history-limit: 20             # 注入 LLM 的历史消息条数
    context-history-window-chars: 4000    # 注入 LLM 的历史总字符上限
    max-upload-bytes: 10485760            # 上传文件字节上限(10MB)
    max-attachments-per-message: 4        # 单条消息附件数上限
    vision-models:                        # 视觉识别候选(chat.image 帧按序尝试)
      - glm-4.6v-flash
      - glm-4.1v-thinking-flash
      - qwen-vl-max
    tts-voice-map:                        # voice_style → DashScope cosyvoice 音色
      sweet: longwan
      magnetic: longcheng
      young: longhua
      mature: longqing
      cute: longxian
      hoarse: longfei
      calm: longjing

# ---------- AgentScope 2.0.0-RC4 A2A 客户端 + Studio 追踪 ----------
# nblm-app 通过 A2aAgent + NacosAgentCardResolver 调 schedule-agent
# (B4 接入;B5 替换为 CompanionChatService ReAct 循环里的 @Tool 工具)
agentscope:
  a2a:
    client:
      enabled: ${AGENTSCOPE_A2A_CLIENT_ENABLED:false}    # 默认关(B4 接入;B5 切到真用时再开)
      agent-name: schedule-agent-v1                      # Nacos 上 schedule-agent 注册的 card name
      # Nacos 服务端连接(与 schedule-agent-server 的 agentscope.a2a.nacos.* 镜像)
      nacos:
        server-addr: ${SCHEDULE_AGENT_NACOS_ADDR:127.0.0.1:8848}
        username: ${SCHEDULE_AGENT_NACOS_USERNAME:nacos}
        password: ${SCHEDULE_AGENT_NACOS_PASSWORD:nacos}
        namespace: ${SCHEDULE_AGENT_NACOS_NAMESPACE:public}
  # 可视化追踪(默认开,Studio server 离线不阻断启动,仅 warn 日志)
  studio:
    enabled: true
    url: ${STUDIO_URL:http://host.docker.internal:3000}

# 论坛居民随机互动(每 5-15min 跑一次,抽最近 24h 帖 → 非作者 agent 点赞/收藏/评论)
resident-interaction:
  enabled: true
  min-interval-minutes: 5
  max-interval-minutes: 15
  max-posts-per-tick: 3
  max-agents-per-post: 2
  like-probability: 0.5
  favorite-probability: 0.3
  comment-probability: 0.6
  lookback-hours: 24
  candidate-post-page-size: 30

# 论坛原作者偶尔回复(收到评论时按概率决定作者要不要回)
author-reply:
  enabled: true
  probability: 0.15
  min-delay-seconds: 5
  max-delay-seconds: 30
  cooldown-ms: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    elasticsearch:
      enabled: false   # 用 Milvus 做向量库,不用 ES
